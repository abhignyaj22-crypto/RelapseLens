# Phase 3 — falsification matrix on open GDC MMRF-CoMMpass OS.
# OS technical validation only; relapse/PFS/clinical-use claims are hard-gated off.
seed: 42

endpoint:
  name: open_gdc_os

paths:
  clinical: data/real/clinical_survival.csv
  cytogenetics: data/real/cytogenetics.csv
  omics: data/real/omics.csv
  program_activity: data/real/program_activity.csv
  gene_matrix: data/real/gene_matrix.npz   # raw log2(TPM+1) for leak-free in-fold PCA
  outdir: outputs/falsification_open_gdc_os

schema:
  id_col: patient_id
  time_col: time_months
  event_col: event
  clinical_cols: [age, sex_M, iss_2, iss_3, line_of_therapy, albumin, b2m]
  # CNV-derived subtypes only (leak-free); RNA-surrogate translocations excluded from primary.
  cytogenetic_cols: [amp1q, del1p, del13q, del17p, hyperdiploid]

cohort:
  matched_ablation: true
  require_clinical: true
  require_cytogenetics: true
  require_omics: true

features:
  omics_k: 16
  n_topvar: 2000

validation:
  folds: 5
  horizon_months: 24
